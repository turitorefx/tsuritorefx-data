name: Update public fishing data
on:
  workflow_dispatch:
  schedule:
    # JST 02:17, 05:17, 08:17, 11:17, 14:17, 17:17, 20:17, 23:17
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: tsuritore-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Update multi-source catches
        run: python scripts/update_catches.py
      - name: Update JMA tides
        run: python scripts/update_tides.py
      - name: Update facilities weekly or manual
        shell: bash
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/update_facilities.py
          fi
      - name: Commit data changes only
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ version.json
          git commit -m "data: refresh fishing feeds and tides"
          git push
